<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0d">
<title>NuLL prompts</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#0c0c0d;--card:#141416;--card2:#1a1a1d;--line:#26262a;--line2:#34343a;--ink:#ececec;--sub:#86868c;--red:#e0222e}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:10;background:rgba(12,12,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1120px;margin:0 auto;padding:12px 16px 0;display:flex;gap:8px;align-items:center}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em;margin-right:6px;white-space:nowrap}
.logo i{font-style:normal;color:var(--red)}
.q{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--card);outline:0}
.q:focus{border-color:var(--line2);background:var(--card2)}
.q::placeholder{color:var(--sub)}
.btn{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--line2)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.red{color:var(--red)}
.icon{width:38px;padding:0;display:grid;place-items:center}
.adm{display:none}
body.admin .adm{display:block}

.fl{max-width:1120px;margin:0 auto;padding:10px 16px 12px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.fl::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);color:var(--sub);font-size:12.5px;white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 4px}
.cnt{flex:none;margin-left:auto;padding-left:10px;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}

main{max-width:1120px;margin:0 auto;padding:16px 16px 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);position:relative;transition:border-color .15s,box-shadow .3s}
.card.flash{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,34,46,.25)}
.card.sel{border-color:var(--ink)}
.ph{display:block;width:100%;background:#000;cursor:zoom-in}
.ph img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover}
.top{display:flex;align-items:center;gap:6px;padding:12px 10px 0 14px}
.n{font-size:11px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.n b{width:5px;height:5px;border-radius:50%;background:var(--red);display:none}
.used .n b{display:block}
.t{flex:1;min-width:0;font-weight:700;font-size:15px;overflow-wrap:anywhere;margin-left:4px}
.ib{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--sub)}
.ib:hover{color:var(--ink);background:var(--card2)}
.ib.fav.on{color:var(--red)}
.cp{flex:none;height:30px;padding:0 12px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700}
.cp.ok{background:var(--red);color:#fff}
.ed{display:none;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);font-size:12px;flex:none}
body.admin .ed{display:block}
.ck{display:none;flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);place-items:center}
body.selecting .ck{display:grid}
body.selecting .cp,body.selecting .ed{display:none}
.ck svg{visibility:hidden}
.sel .ck{background:var(--ink);border-color:var(--ink);color:var(--bg)}.sel .ck svg{visibility:visible}
.tg{display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px 0}
.tg:empty{display:none}
.tg button{font-size:11px;color:var(--sub);background:var(--card2);border-radius:5px;padding:2px 7px}
.tg button:hover{color:var(--ink)}
pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#c4c4c8;padding:10px 14px 14px;max-height:200px;overflow:hidden;position:relative}
.long pre::after{content:"";position:absolute;inset:auto 0 0 0;height:48px;background:linear-gradient(rgba(20,20,22,0),var(--card))}
.open pre{max-height:none}.open pre::after{display:none}
.more{display:block;width:100%;border-top:1px solid var(--line);color:var(--sub);font-size:12px;padding:8px}
.more:hover{color:var(--ink)}
mark{background:rgba(224,34,46,.35);color:#fff;border-radius:2px}
.none{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0}

.sb{position:fixed;left:50%;bottom:16px;transform:translate(-50%,calc(100% + 40px));transition:.2s;z-index:20;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:8px;display:flex;gap:6px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 24px)}
body.selecting .sb{transform:translate(-50%,0)}
.sb span{padding:0 8px;font-size:13px;white-space:nowrap}

.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px}
.box h3{font-size:16px;margin-bottom:14px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.f input[type=text],.f input[type=password],.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:0;background:var(--bg)}
.f textarea{min-height:180px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6}
.f input:focus,.f textarea:focus{border-color:var(--line2)}
.f input[type=file]{font-size:12px;color:var(--sub)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.pv{margin-top:8px;display:none;position:relative}
.pv img{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px;display:block}
.pv button{position:absolute;top:6px;right:6px;height:28px;padding:0 10px;border-radius:6px;background:rgba(0,0,0,.75);color:#fff;font-size:12px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.act .l{margin-right:auto}
.st{font-size:12px;color:var(--sub);margin-top:10px;min-height:16px}
.st.err{color:var(--red)}
#lb{background:rgba(0,0,0,.94);cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;transition:.18s;pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.selecting .toast{bottom:84px}
@media (max-width:560px){
  .hd{flex-wrap:wrap}.q{order:5;flex-basis:100%}.logo{flex:1}
  .fl{padding:10px 12px}main{grid-template-columns:1fr;padding:12px 12px 100px}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo">NuLL<i>.</i></div>
    <input class="q" id="q" type="search" placeholder="검색 · 띄어쓰기로 여러 단어 · #번호" autocomplete="off">
    <button class="btn icon" id="rand" title="랜덤"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></button>
    <button class="btn" id="selBtn">선택</button>
    <button class="btn adm" id="cfgBtn">설정</button>
    <button class="btn pri adm" id="add">추가</button>
    <button class="btn icon" id="gear" title="편집"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  </div>
  <div class="fl" id="fl"></div>
</header>
<main id="list"></main>

<div class="sb" id="sb">
  <span id="sbN">0개</span>
  <button class="btn" id="sbAll">전체</button>
  <button class="btn pri" id="sbCopy">합쳐서 복사</button>
  <button class="btn" id="sbOff">닫기</button>
</div>

<div class="ov" id="edOv"><div class="box">
  <h3 id="edH">추가</h3>
  <label class="f"><span>제목</span><input type="text" id="fT"></label>
  <label class="f"><span>프롬프트</span><textarea id="fP"></textarea></label>
  <label class="f"><span>태그 (쉼표로 구분)</span><input type="text" id="fG" placeholder="예: 담배, 유혈, 정장"></label>
  <div class="f"><span>사진</span>
    <input type="file" id="fI" accept="image/*">
    <div class="pv" id="pv"><img id="pvImg" alt=""><button type="button" id="pvDel">사진 빼기</button></div>
  </div>
  <div class="act">
    <button class="btn red l" id="fDel">삭제</button>
    <button class="btn" data-close>취소</button>
    <button class="btn pri" id="fSave">저장</button>
  </div>
  <div class="st" id="fSt"></div>
</div></div>

<div class="ov" id="cfOv"><div class="box">
  <h3>GitHub 연결</h3>
  <label class="f"><span>토큰</span><input type="password" id="cTok" autocomplete="off"></label>
  <div class="row">
    <label class="f"><span>계정</span><input type="text" id="cOwn"></label>
    <label class="f"><span>저장소</span><input type="text" id="cRepo"></label>
  </div>
  <div class="row">
    <label class="f"><span>브랜치</span><input type="text" id="cBr"></label>
    <label class="f"><span>폴더</span><input type="text" id="cDir"></label>
  </div>
  <div class="act">
    <button class="btn red l" id="cOut">연결 해제</button>
    <button class="btn" id="cBak">백업 받기</button>
    <button class="btn" data-close>취소</button>
    <button class="btn pri" id="cSave">연결</button>
  </div>
  <div class="st" id="cSt"></div>
</div></div>

<div class="ov" id="lb"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DATA=[],admin=false,editing=null,newImg=null,dropImg=false;
let view=ls.get('np_view',{sort:'old',filter:'all',tag:''});
const fav=new Set(ls.get('np_fav',[])),used=new Set(ls.get('np_used',[])),sel=new Set();
const tmpImg={};
const pad=n=>String(n).padStart(3,'0');

/* ---------- 설정 ---------- */
function guess(){
  const h=location.hostname,p=location.pathname.split('/').filter(Boolean);
  if(p.length&&p[p.length-1].includes('.'))p.pop();
  return{owner:h.endsWith('.github.io')?h.split('.')[0]:'yeong-del',repo:p[0]||'GIF__MAKER',dir:p.slice(1).join('/')||'Html_share',branch:'main',token:''};
}
let cfg=Object.assign(guess(),ls.get('nullp_cfg',{}));
const saveCfg=()=>ls.set('nullp_cfg',cfg);

/* ---------- GitHub ---------- */
const fp=f=>(cfg.dir?cfg.dir.replace(/^\/|\/$/g,'')+'/':'')+f;
async function gh(path,{method='GET',body,allow404}={}){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`+(method==='GET'?`?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`:'');
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(r.status===404&&allow404)return null;
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(r.status+(m?' · '+m:''))}
  return r.json();
}
const b64=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function putFile(path,content,msg){const cur=await gh(path,{allow404:true});return gh(path,{method:'PUT',body:{message:msg,content,branch:cfg.branch,...(cur?{sha:cur.sha}:{})}})}
async function delFile(path,msg){const cur=await gh(path,{allow404:true});if(cur)await gh(path,{method:'DELETE',body:{message:msg,sha:cur.sha,branch:cfg.branch}})}
const saveData=msg=>putFile(fp('prompts.json'),b64(JSON.stringify(DATA,null,1)),msg);

async function load(){
  let d=null;
  if(cfg.token){try{d=JSON.parse(unb64((await gh(fp('prompts.json'))).content))}catch(e){}}
  if(!d){try{d=await (await fetch('prompts.json?v='+Date.now())).json()}catch(e){d=[]}}
  d.forEach(x=>{x.tags=x.tags||[];x.t=x.t||'';x.img=x.img||''});
  DATA=d;
}

/* ---------- 필터 ---------- */
function tagList(){const c={};DATA.forEach(d=>d.tags.forEach(t=>c[t]=(c[t]||0)+1));return Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b))}
function renderFilters(){
  const tags=tagList();if(view.tag&&!tags.includes(view.tag))view.tag='';
  const f=[['all','전체'],['fav','즐겨찾기'],['img','사진'],['used','써본 것'],['new','안 써본 것']];
  $('#fl').innerHTML=`<button class="chip" id="sortChip">${view.sort==='old'?'오래된순':'최신순'}</button><span class="sep"></span>`
    +f.map(([k,l])=>`<button class="chip ${view.filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')
    +(tags.length?'<span class="sep"></span>'+tags.map(t=>`<button class="chip ${view.tag===t?'on':''}" data-tag="${esc(t)}"># ${esc(t)}</button>`).join(''):'')
    +`<span class="cnt" id="cnt"></span>`;
}
$('#fl').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  if(b.id==='sortChip')view.sort=view.sort==='old'?'new':'old';
  else if(b.dataset.f)view.filter=b.dataset.f;
  else if(b.dataset.tag!==undefined)view.tag=view.tag===b.dataset.tag?'':b.dataset.tag;
  ls.set('np_view',view);renderFilters();render();
});

function rowsNow(){
  const raw=$('#q').value.trim().toLowerCase();
  const idm=raw.match(/^#?(\d+)$/);
  let rows=DATA.filter(d=>{
    if(view.filter==='fav'&&!fav.has(d.id))return false;
    if(view.filter==='img'&&!(d.img||tmpImg[d.id]))return false;
    if(view.filter==='used'&&!used.has(d.id))return false;
    if(view.filter==='new'&&used.has(d.id))return false;
    if(view.tag&&!d.tags.includes(view.tag))return false;
    if(idm)return d.id===+idm[1];
    if(raw){const hay=(d.t+'\n'+d.p+'\n'+d.tags.join(' ')).toLowerCase();return raw.split(/\s+/).every(w=>hay.includes(w))}
    return true;
  });
  return rows.sort((a,b)=>view.sort==='new'?b.id-a.id:a.id-b.id);
}

/* ---------- 카드 ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(t,words){let e=esc(t);if(!words.length)return e;const r=new RegExp(words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi');return e.replace(r,m=>'<mark>'+m+'</mark>')}
const IC={
 star:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9Z"/></svg>',
 starO:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2.8 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9Z"/></svg>',
 link:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
 check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>'
};
function render(){
  const raw=$('#q').value.trim(),words=/^#?\d+$/.test(raw)?[]:raw.split(/\s+/).filter(Boolean);
  const rows=rowsNow();
  $('#cnt').textContent=rows.length===DATA.length?DATA.length+'개':rows.length+' / '+DATA.length;
  if(!rows.length){$('#list').innerHTML='<div class="none">없음</div>';return}
  $('#list').innerHTML=rows.map(d=>{
    const src=tmpImg[d.id]||d.img;
    return `<article class="card ${used.has(d.id)?'used':''} ${sel.has(d.id)?'sel':''}" id="p${d.id}" data-id="${d.id}">
      ${src?`<a class="ph"><img src="${esc(src)}" loading="lazy" alt=""></a>`:''}
      <div class="top">
        <span class="ck">${IC.check}</span>
        <span class="n"><b></b>${pad(d.id)}</span><span class="t">${hl(d.t,words)}</span>
        <button class="ib fav ${fav.has(d.id)?'on':''}" title="즐겨찾기">${fav.has(d.id)?IC.star:IC.starO}</button>
        <button class="ib lk" title="링크 복사">${IC.link}</button>
        <button class="ed">수정</button><button class="cp">복사</button>
      </div>
      <div class="tg">${d.tags.map(t=>`<button data-tag="${esc(t)}"># ${hl(t,words)}</button>`).join('')}</div>
      <pre>${hl(d.p,words)}</pre></article>`}).join('');
  $$('.card').forEach(c=>{const pre=c.querySelector('pre');
    if(pre.scrollHeight>pre.clientHeight+4){c.classList.add('long');const b=document.createElement('button');b.className='more';b.textContent='더보기';c.appendChild(b)}});
}
function flash(id){const c=document.getElementById('p'+id);if(!c)return;c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1600)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1300)}
async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.remove();return ok}
}
function markUsed(id){used.add(id);ls.set('np_used',[...used]);document.getElementById('p'+id)?.classList.add('used')}

$('#list').addEventListener('click',async e=>{
  const card=e.target.closest('.card');if(!card)return;
  const id=+card.dataset.id,d=DATA.find(x=>x.id===id);
  if(document.body.classList.contains('selecting')&&!e.target.closest('.ph,.more,.fav,.lk,.tg button')){toggleSel(id,card);return}
  if(e.target.closest('.cp')){const b=e.target.closest('.cp');
    if(await copy(d.p)){markUsed(id);b.textContent='복사됨';b.classList.add('ok');setTimeout(()=>{b.textContent='복사';b.classList.remove('ok')},1100)}else toast('복사 실패')}
  else if(e.target.closest('.fav')){const b=e.target.closest('.fav');fav.has(id)?fav.delete(id):fav.add(id);ls.set('np_fav',[...fav]);
    b.classList.toggle('on',fav.has(id));b.innerHTML=fav.has(id)?IC.star:IC.starO;if(view.filter==='fav')render()}
  else if(e.target.closest('.lk')){const u=location.origin+location.pathname+'#p'+id;toast(await copy(u)?'링크 복사됨':'복사 실패')}
  else if(e.target.closest('.tg button')){view.tag=e.target.closest('.tg button').dataset.tag;ls.set('np_view',view);renderFilters();render();scrollTo({top:0,behavior:'smooth'})}
  else if(e.target.closest('.more')){card.classList.toggle('open');e.target.textContent=card.classList.contains('open')?'접기':'더보기'}
  else if(e.target.closest('.ed'))openEditor(d);
  else if(e.target.closest('.ph')){$('#lbImg').src=e.target.closest('.ph').querySelector('img').src;open('#lb')}
});
$('#lb').onclick=()=>close('#lb');
let tm;$('#q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,120)});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape')$$('.ov.show').forEach(o=>o.classList.remove('show'));
});
$('#rand').onclick=()=>{const r=rowsNow();if(!r.length)return;const d=r[Math.floor(Math.random()*r.length)];flash(d.id)};

/* ---------- 선택 ---------- */
function setSelecting(on){document.body.classList.toggle('selecting',on);$('#selBtn').classList.toggle('on',on);if(!on){sel.clear();$$('.card.sel').forEach(c=>c.classList.remove('sel'))}updSel()}
function toggleSel(id,card){sel.has(id)?sel.delete(id):sel.add(id);card.classList.toggle('sel',sel.has(id));updSel()}
function updSel(){$('#sbN').textContent=sel.size+'개'}
$('#selBtn').onclick=()=>setSelecting(!document.body.classList.contains('selecting'));
$('#sbOff').onclick=()=>setSelecting(false);
$('#sbAll').onclick=()=>{const r=rowsNow();const all=r.every(d=>sel.has(d.id));r.forEach(d=>all?sel.delete(d.id):sel.add(d.id));render();updSel()};
$('#sbCopy').onclick=async()=>{
  if(!sel.size)return toast('선택한 게 없어요');
  const parts=DATA.filter(d=>sel.has(d.id)).sort((a,b)=>a.id-b.id).map(d=>d.p.trim().replace(/,\s*$/,''));
  if(await copy(parts.join(',\n\n'))){sel.forEach(markUsed);toast(sel.size+'개 복사됨')}else toast('복사 실패');
};

/* ---------- 모달 ---------- */
const open=id=>$(id).classList.add('show'),close=id=>$(id).classList.remove('show');
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('show'));
$$('.ov').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o&&o.id!=='lb')o.classList.remove('show')}));

/* ---------- 관리 ---------- */
function setAdmin(v){admin=v;document.body.classList.toggle('admin',v);$('#gear').classList.toggle('on',v)}
$('#gear').onclick=()=>{if(admin)setAdmin(false);else if(cfg.token)setAdmin(true);else openCfg()};
$('#cfgBtn').onclick=openCfg;
function openCfg(){$('#cTok').value=cfg.token;$('#cOwn').value=cfg.owner;$('#cRepo').value=cfg.repo;$('#cBr').value=cfg.branch;$('#cDir').value=cfg.dir;$('#cSt').className='st';$('#cSt').textContent='';open('#cfOv')}
$('#cSave').onclick=async()=>{
  Object.assign(cfg,{token:$('#cTok').value.trim(),owner:$('#cOwn').value.trim(),repo:$('#cRepo').value.trim(),branch:$('#cBr').value.trim()||'main',dir:$('#cDir').value.trim()});
  $('#cSt').className='st';$('#cSt').textContent='확인 중…';
  try{await gh(fp('prompts.json'));saveCfg();await load();renderFilters();render();close('#cfOv');setAdmin(true);toast('연결됨')}
  catch(e){$('#cSt').className='st err';$('#cSt').textContent='연결 실패 ('+e.message+')'}
};
$('#cOut').onclick=()=>{cfg.token='';saveCfg();setAdmin(false);close('#cfOv');toast('연결 해제')};
$('#cBak').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'}));
  a.download='prompts-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
};

$('#add').onclick=()=>openEditor(null);
function openEditor(d){
  editing=d;newImg=null;dropImg=false;
  $('#edH').textContent=d?pad(d.id)+' 수정':'추가';
  $('#fT').value=d?d.t:'';$('#fP').value=d?d.p:'';$('#fG').value=d?d.tags.join(', '):'';$('#fI').value='';
  showPv(d?(tmpImg[d.id]||d.img):'');
  $('#fDel').style.display=d?'':'none';
  $('#fSt').className='st';$('#fSt').textContent='';
  open('#edOv');setTimeout(()=>$(d?'#fP':'#fT').focus(),50);
}
function showPv(src){$('#pv').style.display=src?'block':'none';$('#pvImg').src=src||''}
$('#pvDel').onclick=()=>{newImg=null;dropImg=true;$('#fI').value='';showPv('')};
$('#fI').onchange=async()=>{const f=$('#fI').files[0];if(!f)return;try{newImg=await shrink(f,1600,.86);dropImg=false;showPv(newImg)}catch(e){toast('사진을 못 읽었어요')}};
function shrink(file,max,q){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  im.onerror=rej;im.src=url})}
function busy(on,msg,err){['#fSave','#fDel'].forEach(s=>$(s).disabled=on);$('#fSt').className='st'+(err?' err':'');$('#fSt').textContent=msg||''}
$('#fSave').onclick=async()=>{
  const t=$('#fT').value.trim(),p=$('#fP').value.trim(),tags=[...new Set($('#fG').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean))];
  if(!p)return busy(false,'프롬프트를 넣어주세요',true);
  busy(true,'저장 중…');
  try{
    await load();
    let d=editing?DATA.find(x=>x.id===editing.id):null;
    if(!d){d={id:DATA.reduce((m,x)=>Math.max(m,x.id),0)+1,t:'',p:'',tags:[],img:''};DATA.push(d)}
    Object.assign(d,{t,p,tags});
    const oldImg=d.img;
    if(newImg){busy(true,'사진 올리는 중…');const name=`img/${pad(d.id)}-${Date.now().toString(36)}.jpg`;await putFile(fp(name),newImg.split(',')[1],'img '+d.id);d.img=name;tmpImg[d.id]=newImg}
    else if(dropImg){d.img='';delete tmpImg[d.id]}
    busy(true,'저장 중…');
    await saveData((editing?'edit ':'add ')+d.id);
    if(oldImg&&oldImg!==d.img){try{await delFile(fp(oldImg),'remove img '+d.id)}catch(e){}}
    close('#edOv');renderFilters();render();busy(false);toast('저장됨');if(!editing)setTimeout(()=>flash(d.id),100);
  }catch(e){busy(false,'저장 실패 ('+e.message+')',true)}
};
$('#fDel').onclick=async()=>{
  if(!editing||!confirm(pad(editing.id)+' 삭제할까요?'))return;
  busy(true,'삭제 중…');
  try{
    await load();const d=DATA.find(x=>x.id===editing.id);
    DATA=DATA.filter(x=>x.id!==editing.id);await saveData('delete '+editing.id);
    if(d&&d.img){try{await delFile(fp(d.img),'remove img '+d.id)}catch(e){}}
    close('#edOv');renderFilters();render();busy(false);toast('삭제됨');
  }catch(e){busy(false,'삭제 실패 ('+e.message+')',true)}
};

(async()=>{await load();renderFilters();render();const m=location.hash.match(/^#p(\d+)$/);if(m)setTimeout(()=>flash(+m[1]),200)})();
</script>
</body>
</html>
