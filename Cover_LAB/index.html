<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COVER LAB — 표지·에셋 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{--bg:#0c0c10;--panel:#15151b;--panel2:#1c1c24;--line:#2a2a35;--text:#ececf2;--mute:#8b8b9c;--acc:#a855ff;--acc2:#6d28d9;--danger:#ff4d6d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a4a60}
button.on{background:var(--acc2);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:#0e0e13;border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px}
input[type=color]{width:32px;height:26px;padding:1px;border-radius:6px;flex:none;cursor:pointer}
input[type=range]{accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.12em;margin-right:6px;font-size:14px}
.brand b{color:var(--acc)}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.grow{flex:1}
#zoomLbl{min-width:44px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:236px 1fr 312px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.stage{overflow:auto;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#16161d,#09090c)}
.board{position:relative;margin:24px;box-shadow:0 12px 50px #000a;background-color:#fff;background-image:conic-gradient(#d8d8d8 25%,#fff 0 50%,#d8d8d8 0 75%,#fff 0);background-size:18px 18px}
#cv,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.board.brush #ov{cursor:none}
.board.wand #ov{cursor:crosshair}
details{border-bottom:1px solid var(--line)}
summary{padding:10px 12px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;user-select:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'▾';color:var(--mute);font-size:11px}
details:not([open]) summary::after{content:'▸'}
.sec{padding:2px 12px 12px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;min-height:28px}
.row>label{color:var(--mute);font-size:12px}
.ctl{display:flex;gap:6px;align-items:center;min-width:0}
.ctl input[type=range]{flex:1;min-width:0}
.ctl input[type=number]{width:64px}
.ctl select{flex:1}
.btns{display:flex;gap:5px;flex-wrap:wrap}
.btns button{padding:5px 8px;font-size:12px}
.note{color:var(--mute);font-size:11.5px;line-height:1.5}
.note code{background:#24242e;padding:0 4px;border-radius:4px;color:#d9c2ff}
.layers{list-style:none;margin:0;padding:6px;display:grid;gap:3px}
.layer{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;border:1px solid transparent;cursor:pointer;user-select:none}
.layer:hover{background:#1f1f28}
.layer.sel{background:#2a1a44;border-color:var(--acc2)}
.layer.hid .nm{opacity:.4}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .ty{width:20px;height:20px;border-radius:5px;background:#262631;display:grid;place-items:center;font-size:11px;font-weight:900;color:#c9b3ff;flex:none}
.layer .ic{padding:2px;border:0;background:transparent;opacity:.75;display:grid;place-items:center}
.layer .ic svg{width:15px;height:15px}
.layer .ic.off{opacity:.25}
.layer.drop{border-top:2px solid var(--acc)}
.lhead{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lhead button{padding:4px 7px;font-size:12px}
.empty{padding:20px 14px;color:var(--mute);line-height:1.7}
.fontbtn{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.fpop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px #000c;width:320px;max-width:92vw;max-height:70vh;display:flex;flex-direction:column}
.fpop input{margin:8px;padding:7px 9px}
.fpop .tabs{display:flex;gap:4px;padding:0 8px 6px;flex-wrap:wrap}
.fpop .tabs button{padding:3px 8px;font-size:11.5px}
.fpop .list{overflow:auto;padding:0 6px 8px}
.fpop .grp{color:var(--mute);font-size:11px;padding:8px 6px 3px;letter-spacing:.05em}
.fpop .it{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpop .it:hover{background:#262633}
.fpop .it.cur{background:#2a1a44}
.fpop .it small{font:11px "Noto Sans KR";color:var(--mute);margin-left:6px}
.srow{display:grid;grid-template-columns:18px 32px 1fr 56px 26px;gap:6px;align-items:center}
.srow .idx{color:var(--mute);font-size:11px;text-align:center}
.srow button{padding:2px;font-size:12px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.presets button{font-size:12px;padding:6px 6px;text-align:left;overflow:hidden;text-overflow:ellipsis}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.modes button{padding:6px 2px;font-size:12px}
.menu{position:fixed;z-index:55;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px #000c;padding:5px;display:grid;min-width:170px}
.menu button{border:0;background:transparent;text-align:left;padding:7px 10px}
.menu button:hover{background:#262633}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:420px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px #000}
.modal h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}
.modal .body{padding:14px 16px;display:grid;gap:10px}
.modal .foot{display:flex;gap:6px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#22222c;border:1px solid var(--line);padding:9px 14px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.prog{height:6px;background:#26262f;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.flist{display:grid;gap:4px}
.flist div{display:flex;align-items:center;gap:6px;background:#1c1c25;padding:5px 8px;border-radius:6px}
.flist span{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  html,body{overflow:auto;height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:62vh;order:-1}
  .right{order:0;border:0;border-top:1px solid var(--line)}
  .left{order:1;border:0;border-top:1px solid var(--line)}
  .top{position:sticky;top:0;z-index:20}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">COVER<b>LAB</b></div>
    <button id="bNew">새 캔버스</button>
    <div class="sep"></div>
    <button id="bText" class="pri">T 텍스트</button>
    <button id="bImg">이미지</button>
    <button id="bShape">도형 ▾</button>
    <button id="bFonts">폰트 관리</button>
    <div class="sep"></div>
    <button id="bUndo" title="실행 취소 (Ctrl+Z)">↶</button>
    <button id="bRedo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
    <div class="sep"></div>
    <button id="bZo">−</button><span id="zoomLbl">100%</span><button id="bZi">+</button><button id="bFit">맞춤</button>
    <div class="grow"></div>
    <button id="bProj">프로젝트 ▾</button>
    <button id="bExport" class="pri">내보내기</button>
  </div>
  <div class="main">
    <aside class="left">
      <div class="lhead">
        <button id="lUp" title="위로">▲</button><button id="lDown" title="아래로">▼</button>
        <button id="lDup">복제</button><button id="lDel" class="danger">삭제</button>
      </div>
      <ul class="layers" id="layers"></ul>
      <div id="canvasSec"></div>
    </aside>
    <section class="stage" id="stage">
      <div class="board" id="board"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
    </section>
    <aside class="right" id="props"></aside>
  </div>
</div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
<input type="file" id="fProj" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
'use strict';
/* ================= 기본 유틸 ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;};
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const ks=p.split('.');const l=ks.pop();ks.reduce((a,k)=>a[k],o)[l]=v;};
const clone=o=>JSON.parse(JSON.stringify(o));
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e[k]=v;else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v);}for(const k of kids.flat(9)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}return e;}
let toastT;function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}
function toHex6(c){if(!c)return'#000000';c=String(c).trim();if(/^#[0-9a-f]{3}$/i.test(c))return'#'+c.slice(1).split('').map(x=>x+x).join('');if(/^#[0-9a-f]{6,8}$/i.test(c))return c.slice(0,7);return'#000000';}
const FILTER_OK=(()=>{try{const g=mk(2,2).getContext('2d');g.filter='blur(1px)';return g.filter==='blur(1px)';}catch(e){return false;}})();
function drawBlur(g,img,x,y,r){
  if(r<=0.05){g.drawImage(img,x,y);return;}
  if(FILTER_OK){const f=g.filter;g.filter=`blur(${r}px)`;g.drawImage(img,x,y);g.filter=f;return;}
  const s=Math.max(1,r/1.2),w=Math.max(1,Math.round(img.width/s)),h=Math.max(1,Math.round(img.height/s));
  const t=mk(w,h),tg=t.getContext('2d');tg.imageSmoothingQuality='high';tg.drawImage(img,0,0,w,h);
  g.save();g.imageSmoothingQuality='high';g.drawImage(t,x,y,img.width,img.height);g.restore();
}
function tint(src,color){const c=mk(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,c.width,c.height);return c;}
function rrPath(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const toBlob=(c,type='image/png',q)=>new Promise(r=>c.toBlob(r,type,q));
async function blobToCanvas(b){const bm=await createImageBitmap(b);const c=mk(bm.width,bm.height);c.getContext('2d').drawImage(bm,0,0);return c;}
async function urlToCanvas(u){const r=await fetch(u);return blobToCanvas(await r.blob());}
function ab2b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b642ab(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}

/* ================= IndexedDB (폰트·자동저장) ================= */
const idb={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const r=indexedDB.open('coverlab',1);r.onupgradeneeded=()=>{r.result.createObjectStore('fonts',{keyPath:'family'});r.result.createObjectStore('kv');};r.onsuccess=()=>{this.db=r.result;res(r.result);};r.onerror=()=>rej(r.error);});},
  async tx(store,mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});},
  put(store,val,key){return this.tx(store,'readwrite',s=>key===undefined?s.put(val):s.put(val,key));},
  get(store,key){return this.tx(store,'readonly',s=>s.get(key));},
  all(store){return this.tx(store,'readonly',s=>s.getAll());},
  del(store,key){return this.tx(store,'readwrite',s=>s.delete(key));}
};

/* ================= 폰트 ================= */
const GF_KO=['Black Han Sans','Do Hyeon','Jua','Gugi','Noto Sans KR:wght@100..900','Noto Serif KR:wght@200..900','Nanum Gothic:wght@400;700;800','Nanum Myeongjo:wght@400;700;800','Nanum Pen Script','Nanum Brush Script','Gothic A1:wght@100;200;300;400;500;600;700;800;900','Hahmlet:wght@100..900','IBM Plex Sans KR:wght@100;200;300;400;500;600;700','Song Myung','Dokdo','East Sea Dokdo','Bagel Fat One','Orbit','Gasoek One','Diphylleia','Moirai One','Dongle:wght@300;400;700','Yeon Sung','Stylish','Gowun Batang:wght@400;700','Gowun Dodum','Sunflower:wght@300;500;700','Hi Melody','Kirang Haerang','Gaegu:wght@300;400;700','Black And White Picture','Cute Font','Poor Story','Single Day'];
const GF_EN=['Anton','Bebas Neue','Oswald:wght@200..700','Russo One','Archivo Black','Unbounded:wght@200..900','Cinzel:wght@400..900','Syncopate:wght@400;700','Michroma','Orbitron:wght@400..900','Audiowide','Zen Dots','Black Ops One','Bungee','Monoton','Righteous','Rubik Glitch','Rubik Mono One','Staatliches','Teko:wght@300..700','Montserrat:wght@100..900','Inter:wght@100..900','Playfair Display:wght@400..900','Bodoni Moda:wght@400..900','Cormorant Garamond:wght@300..700','Abril Fatface','UnifrakturMaguntia','Pirata One','Metal Mania','Creepster','Permanent Marker','Rock Salt','Special Elite','Pacifico','Great Vibes'];
const gfName=s=>s.split(':')[0];
const GF_MAP=new Map([...GF_KO,...GF_EN].map(s=>[gfName(s),s]));
const gfLoaded=new Set();
function ensureGF(name){const spec=GF_MAP.get(name);if(!spec||gfLoaded.has(name))return;gfLoaded.add(name);
  const href='https://fonts.googleapis.com/css2?family='+spec.replace(/ /g,'+')+'&display=swap';
  document.head.append(el('link',{rel:'stylesheet',href,onload:()=>{bumpFonts();}}));}
let userFonts=[];   // {family, buf}
let localFamilies=[]; // PC 설치 폰트
let customFamilies=[]; // 이름으로 직접 입력한 폰트
let fontEpoch=0;
const fontReq=new Set();
function bumpFonts(){fontEpoch++;requestRender();}
function fontStr(L,size){return `${L.italic?'italic ':''}${L.weight} ${size}px "${L.font}", "Noto Sans KR", sans-serif`;}
function ensureFont(L){ensureGF(L.font);const k=fontStr(L,40)+'|'+L.text;if(fontReq.has(k))return;fontReq.add(k);
  if(document.fonts&&document.fonts.load)document.fonts.load(fontStr(L,40),L.text.replace(/\[\/?#?[0-9a-f]*\]/gi,'')||'A').then(()=>bumpFonts()).catch(()=>{});}
async function registerFont(family,buf,save=true){
  const ff=new FontFace(family,buf.slice(0));await ff.load();document.fonts.add(ff);
  const ex=userFonts.find(f=>f.family===family);if(ex)ex.buf=buf;else userFonts.push({family,buf});
  if(save){try{await idb.put('fonts',{family,data:buf});}catch(e){}}
  bumpFonts();
}
async function addFontFiles(files){let n=0;for(const f of files){try{const buf=await f.arrayBuffer();const family=f.name.replace(/\.(ttf|otf|woff2?|ttc)$/i,'');await registerFont(family,buf);n++;}catch(e){toast(`${f.name}: 폰트를 읽지 못했어요`);}}
  if(n){toast(`폰트 ${n}개 추가됨`);buildProps();}}
async function loadLocalFonts(){
  if(!('queryLocalFonts' in window)){toast('이 화면에선 PC 폰트 목록을 못 읽어요. 크롬/엣지에서 HTML 파일로 열거나, 폰트 이름을 직접 입력하세요.',5200);return false;}
  try{const fonts=await window.queryLocalFonts();localFamilies=[...new Set(fonts.map(f=>f.family))].sort((a,b)=>a.localeCompare(b,'ko'));toast(`PC 폰트 ${localFamilies.length}개를 불러왔어요`);return true;}
  catch(e){toast('PC 폰트 접근이 막혔어요 (이 화면에선 권한이 없을 수 있어요). 폰트 이름 직접 입력 또는 파일 업로드를 써 주세요.',5600);return false;}
}
function fontInstalled(name){const g=mctx;const t='가나다ABCabc123WMi';const out=[];for(const fb of['monospace','serif']){g.font=`72px ${fb}`;const a=g.measureText(t).width;g.font=`72px "${name}", ${fb}`;out.push(g.measureText(t).width!==a);}return out[0]||out[1];}

/* ================= 상태 ================= */
const S={w:832,h:1216,bg:{transparent:false,color:'#141418'},layers:[]};
const assets=new Map(); // id -> {name, orig, mask, comp, ver}
let selId=null, zoom=1, autoFit=true, mode='move';
const brush={size:60,hard:0.55}, wand={tol:36,contig:true};
const cur=()=>S.layers.find(l=>l.id===selId)||null;

const defFx=()=>({shadow:{on:false,color:'#000000',x:6,y:8,blur:12,alpha:0.6},glow:{on:false,color:'#a855ff',size:18,alpha:0.9},outline:{on:false,color:'#ffffff',size:8},chroma:{on:false,dist:5},blur:0,adj:{bright:100,contrast:100,sat:100,hue:0,gray:0}});
const baseL=(type,name)=>({id:uid(),type,name,visible:true,locked:false,x:S.w/2,y:S.h/2,rot:0,skew:0,sx:1,sy:1,flipX:false,flipY:false,opacity:1,blend:'source-over',fx:defFx()});
const defFill=()=>({type:'solid',color:'#ffffff',c1:'#ffffff',c2:'#a855ff',angle:90});
const TEXT_DEF=()=>({text:'TITLE',autoName:true,font:'Black Han Sans',weight:400,italic:false,size:120,spacing:0,lineH:1.15,align:'center',vertical:false,fill:defFill(),strokes:[],join:'round',box:{on:false,color:'#8b2cff',padX:20,padY:8,radius:0}});
const SHAPE_DEF=()=>({shape:'rect',w:420,h:96,radius:0,fill:Object.assign(defFill(),{color:'#8b2cff'}),strokeColor:'#ffffff',strokeW:0,backdrop:0});
function deepMerge(def,o){if(o==null)return def;if(Array.isArray(def)||typeof def!=='object')return o;const r={...def};for(const k of Object.keys(o)){r[k]=(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k]))?deepMerge(def[k],o[k]):o[k];}return r;}
function normalize(L){let d=baseL(L.type,L.name);if(L.type==='text')Object.assign(d,TEXT_DEF());if(L.type==='shape')Object.assign(d,SHAPE_DEF());return deepMerge(d,L);}
function newText(t='TITLE'){const L=Object.assign(baseL('text','텍스트'),TEXT_DEF(),{text:t});L.name=nameOf(L);return L;}

const mctx=mk(4,4).getContext('2d');

}

function renderText(L){

    lines.forEach((l,i)=>{let x=L.align==='left'?0:L.align==='right'?cw-widths[i]:(cw-widths[i])/2;const y=i*lh+lh/2;
      if(l.length)rects.push({x:x-bx,y:y-size*0.62-by,w:widths[i]+bx*2,h:size*1.24+by*2});
      l.forEach(c=>{items.push({ch:c.ch,color:c.color,x:x+c.w/2,y});x+=c.w+ls;});});
  }else{
    const step=size+ls,colW=lh;const heights=lines.map(l=>l.length?l.length*step-ls:0);
    ch=Math.max(1,...heights);cw=colW*lines.length;
    lines.forEach((l,i)=>{const x=cw-(i+0.5)*colW;let y=L.align==='left'?0:L.align==='right'?ch-heights[i]:(ch-heights[i])/2;
      if(l.length)rects.push({x:x-size*0.62-bx,y:y-by,w:size*1.24+bx*2,h:heights[i]+by*2});
      l.forEach(c=>{items.push({ch:c.ch,color:c.color,x,y:y+size/2});y+=step;});});

function shapePath(g,L,ox,oy){

function renderImage(L){const a=assets.get(L.asset);if(!a)return null;return {canvas:a.comp,cw:a.comp.width,ch:a.comp.height};}

function matrix(L){return new DOMMatrix().translate(L.x,L.y).rotate(L.rot).skewX(L.skew).scale(L.sx*(L.flipX?-1:1),L.sy*(L.flipY?-1:1));}
function drawScene(g,{bg=true,only=null}={}){

/* ================= 오버레이 / 선택 ================= */
let guides={v:false,h:false},hover=null,drag=null;
function selInfo(){
  const L=cur();if(!L||!L.visible)return null;const r=renderLayer(L);if(!r)return null;
  const m=matrix(L),hw=r.cw/2,hh=r.ch/2;
  const pts=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh],[0,-hh],[hw,0],[0,hh],[-hw,0]].map(([x,y])=>m.transformPoint(new DOMPoint(x,y)));
  const c=m.transformPoint(new DOMPoint(0,0));const tm=pts[4];let dx=tm.x-c.x,dy=tm.y-c.y;const len=Math.hypot(dx,dy)||1;
  const rh={x:tm.x+dx/len*30/zoom,y:tm.y+dy/len*30/zoom};
  return {L,r,pts,c,rh};
}
function drawOverlay(){
  const g=ov.getContext('2d'),dpr=window.devicePixelRatio||1,k=zoom*dpr;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,ov.width,ov.height);
  g.lineWidth=1.5*dpr;
  if(guides.v||guides.h){g.strokeStyle='#ff3df2';g.setLineDash([6*dpr,4*dpr]);g.beginPath();if(guides.v){g.moveTo(S.w/2*k,0);g.lineTo(S.w/2*k,S.h*k);}if(guides.h){g.moveTo(0,S.h/2*k);g.lineTo(S.w*k,S.h/2*k);}g.stroke();g.setLineDash([]);}
  const si=selInfo();
  if(si){const P=si.pts.map(p=>({x:p.x*k,y:p.y*k}));
    g.strokeStyle=si.L.locked?'#888':'#b77bff';g.beginPath();for(let i=0;i<4;i++)i?g.lineTo(P[i].x,P[i].y):g.moveTo(P[i].x,P[i].y);g.closePath();g.stroke();
    if(!si.L.locked&&mode==='move'){
      g.beginPath();g.moveTo(P[4].x,P[4].y);g.lineTo(si.rh.x*k,si.rh.y*k);g.stroke();
      const hs=5*dpr;g.fillStyle='#fff';
      for(const p of P){g.fillRect(p.x-hs,p.y-hs,hs*2,hs*2);g.strokeRect(p.x-hs,p.y-hs,hs*2,hs*2);}
      g.beginPath();g.arc(si.rh.x*k,si.rh.y*k,6*dpr,0,Math.PI*2);g.fill();g.stroke();
    }
  }
  if(hover&&(mode==='erase'||mode==='restore')){g.strokeStyle='#fff';g.beginPath();g.arc(hover.x*k,hover.y*k,brush.size/2*k,0,Math.PI*2);g.stroke();g.strokeStyle='#000';g.beginPath();g.arc(hover.x*k,hover.y*k,brush.size/2*k+1.5*dpr,0,Math.PI*2);g.stroke();}
}
function docPt(e){const r=ov.getBoundingClientRect();return {x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom};}
function insideLayer(L,p,alpha=true){const r=renderLayer(L);if(!r)return false;const lp=matrix(L).inverse().transformPoint(new DOMPoint(p.x,p.y));

    try{if(!a._px)a._px=a.comp.getContext('2d',{willReadFrequently:true}).getImageData(0,0,a.comp.width,a.comp.height).data;return a._px[(py*a.comp.width+px)*4+3]>12;}catch(e){return true;}}

ov.addEventListener('pointerdown',e=>{
  if(e.button===2)return;
  const p=docPt(e),tol=(e.pointerType==='touch'?22:11)/zoom,L=cur();
  ov.setPointerCapture(e.pointerId);

    if(mode==='wand'){wandAt(L,p);return;}
    const a=assets.get(L.asset);cowMask(a);drag={t:'brush',L,last:p};paintAt(L,p,null);return;
  }
  const si=selInfo();
  if(si&&!si.L.locked){
    if(dist(p,si.rh)<tol){const a0=Math.atan2(p.y-si.c.y,p.x-si.c.x);drag={t:'rot',L,a0,r0:L.rot,c:si.c};return;}
    for(let i=0;i<8;i++)if(dist(p,si.pts[i])<tol){drag={t:i<4?'scale':(i===5||i===7?'sx':'sy'),L,c:si.c,d0:dist(p,si.c),p0:p,s0:{size:L.size,w:L.w,h:L.h,sx:L.sx,sy:L.sy}};
      const mm=new DOMMatrix().translate(L.x,L.y).rotate(L.rot).skewX(L.skew);drag.mm=mm.inverse();drag.l0=drag.mm.transformPoint(new DOMPoint(p.x,p.y));return;}
    if(insideLayer(si.L,p,false)){drag={t:'move',L:si.L,p0:p,x0:si.L.x,y0:si.L.y};return;}
  }
  const hit=hitTest(p);
  if(hit){if(hit.id!==selId){selId=hit.id;refreshAll();}drag={t:'move',L:hit,p0:p,x0:hit.x,y0:hit.y};}
  else{if(selId){selId=null;refreshAll();}}

  if(drag.t==='move'){let nx=drag.x0+p.x-drag.p0.x,ny=drag.y0+p.y-drag.p0.y;const sn=7/zoom;guides.v=Math.abs(nx-S.w/2)<sn;guides.h=Math.abs(ny-S.h/2)<sn;if(guides.v)nx=S.w/2;if(guides.h)ny=S.h/2;L.x=Math.round(nx*10)/10;L.y=Math.round(ny*10)/10;drag.moved=true;}
  else if(drag.t==='rot'){let a=L.rot=drag.r0+(Math.atan2(p.y-drag.c.y,p.x-drag.c.x)-drag.a0)*180/Math.PI;a=((a%360)+540)%360-180;const sn=Math.round(a/15)*15;if(Math.abs(a-sn)<3)a=sn;L.rot=Math.round(a*10)/10;drag.moved=true;}

    if(L.type==='text')L.size=Math.max(4,Math.round(s.size*f));else if(L.type==='shape'){L.w=Math.max(2,Math.round(s.w*f));L.h=Math.max(2,Math.round(s.h*f));}else{L.sx=s.sx*f;L.sy=s.sy*f;}drag.moved=true;}
  else if(drag.t==='sx'||drag.t==='sy'){const lp=drag.mm.transformPoint(new DOMPoint(p.x,p.y));const ax=drag.t==='sx'?'x':'y';const f=Math.max(0.02,Math.abs(lp[ax])/Math.max(1,Math.abs(drag.l0[ax])));const s=drag.s0;
    if(L.type==='shape'){if(ax==='x')L.w=Math.max(2,Math.round(s.w*f));else L.h=Math.max(2,Math.round(s.h*f));}else{if(ax==='x')L.sx=s.sx*f;else L.sy=s.sy*f;}drag.moved=true;}

function toAssetPx(L,p){const a=assets.get(L.asset);const lp=matrix(L).inverse().transformPoint(new DOMPoint(p.x,p.y));return {x:lp.x+a.orig.width/2,y:lp.y+a.orig.height/2,a};}

function addLayer(L){S.layers.push(L);selId=L.id;setMode('move');commit();refreshAll();}
function delSel(){const i=S.layers.findIndex(l=>l.id===selId);if(i<0)return;S.layers.splice(i,1);selId=null;commit();refreshAll();}
function dupSel(){const L=cur();if(!L)return;const c=clone(Object.fromEntries(Object.entries(L).filter(([k])=>!k.startsWith('_'))));c.id=uid();c.x+=24;c.y+=24;c.name=L.name+' 복사';c.autoName=false;const i=S.layers.indexOf(L);S.layers.splice(i+1,0,c);selId=c.id;commit();refreshAll();}
function moveSel(d){const i=S.layers.findIndex(l=>l.id===selId);const j=i+d;if(i<0||j<0||j>=S.layers.length)return;[S.layers[i],S.layers[j]]=[S.layers[j],S.layers[i]];commit();refreshAll();}

/* ---------- 상단 버튼 ---------- */
$('#bText').onclick=()=>addLayer(newText());
$('#bImg').onclick=()=>$('#fImg').click();
$('#fImg').onchange=async e=>{for(const f of e.target.files)await addImageFile(f);e.target.value='';};
$('#fFont').onchange=async e=>{await addFontFiles(e.target.files);e.target.value='';if(fpop)closeFontPop();};
$('#bShape').onclick=e=>menu(e.currentTarget,Object.entries(SHAPE_NAMES).map(([k,n])=>[n,()=>addLayer(newShape(k))]));
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#bZi').onclick=()=>{autoFit=false;setZoom(zoom*1.2);};$('#bZo').onclick=()=>{autoFit=false;setZoom(zoom/1.2);};$('#bFit').onclick=fit;
$('#lUp').onclick=()=>moveSel(1);$('#lDown').onclick=()=>moveSel(-1);$('#lDup').onclick=dupSel;$('#lDel').onclick=delSel;
$('#bExport').onclick=exportDialog;
$('#bNew').onclick=()=>{
  const pre=el('select',{},PRESETS.map(([n,w,h])=>el('option',{value:w+'x'+h},`${n} (${w}×${h})`)));
  const m=modal('새 캔버스',[row('크기',pre),el('div',{class:'note'},'지금 작업은 사라져요. 필요하면 먼저 [프로젝트 → 저장]으로 보관하세요.')],[['취소',()=>m.close()],['새로 만들기',()=>{const[w,h]=pre.value.split('x').map(Number);S.layers=[];S.bg={transparent:false,color:'#141418'};selId=null;resizeDoc(w,h,false);commit();refreshAll();m.close();},'pri']]);
};
$('#bProj').onclick=e=>menu(e.currentTarget,[
  ['프로젝트 저장 (.json)',async()=>{toast('프로젝트 묶는 중…');const s=await projectJSON();await saveFile('coverlab_'+new Date().toISOString().slice(0,10)+'.json',new Blob([s],{type:'application/json'}));}],
  ['프로젝트 열기',()=>$('#fProj').click()],
]);
$('#fProj').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await loadProject(JSON.parse(await f.text()));toast('프로젝트를 열었어요');}catch(err){toast('프로젝트 파일을 열지 못했어요');}};
$('#bFonts').onclick=()=>{
  const lst=el('div',{class:'flist'});
  const draw=()=>{lst.innerHTML='';if(!userFonts.length)lst.append(el('div',{class:'note'},'아직 추가한 폰트가 없어요.'));
    userFonts.forEach(f=>lst.append(el('div',{},el('span',{style:`font-family:"${f.family}"`},f.family+' 가나다 ABC'),el('button',{class:'danger',onclick:async()=>{userFonts=userFonts.filter(x=>x!==f);try{await idb.del('fonts',f.family);}catch(e){}draw();}},'삭제'))));};
  draw();
  const m=modal('폰트 관리',[
    el('button',{class:'pri',onclick:()=>$('#fFont').click()},'폰트 파일 추가 (.ttf / .otf / .woff)'),
    el('div',{class:'note'},'PC의 C:\\Windows\\Fonts 등에서 파일을 골라 넣으면 이 브라우저에 저장돼서 다음에 열어도 그대로 있어요. 프로젝트 저장 시 사용한 폰트도 같이 묶여요.'),
    lst,
    el('button',{onclick:async()=>{if(await loadLocalFonts()){m.close();}}},'PC에 설치된 폰트 목록 불러오기 (크롬·엣지)'),
    el('div',{class:'note'},'또는 폰트 선택창 검색칸에 설치된 폰트 이름(예: 210 옴니고딕, Pretendard)을 그대로 입력해도 써져요.')
  ],[['닫기',()=>m.close()]]);
  const iv=setInterval(()=>{if(!document.body.contains(lst)){clearInterval(iv);return;}if(lst.childElementCount!==Math.max(1,userFonts.length))draw();},600);
};

/* ---------- 키보드 / 붙여넣기 / 드롭 ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  const mod=e.ctrlKey||e.metaKey;const L=cur();
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel();}
  else if((e.key==='Delete'||e.key==='Backspace')&&L){e.preventDefault();delSel();}
  else if(e.key==='Escape'){selId=null;setMode('move');refreshAll();}
  else if(L&&!L.locked&&e.key.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?10:1;if(e.key==='ArrowLeft')L.x-=s;if(e.key==='ArrowRight')L.x+=s;if(e.key==='ArrowUp')L.y-=s;if(e.key==='ArrowDown')L.y+=s;requestRender();clearTimeout(window._ak);window._ak=setTimeout(()=>{commit();buildProps();},400);}
});
document.addEventListener('paste',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
  const items=[...(e.clipboardData&&e.clipboardData.items||[])].filter(i=>i.type.startsWith('image/'));if(!items.length)return;e.preventDefault();items.forEach(i=>addImageFile(i.getAsFile()));});
stage.addEventListener('dragover',e=>{e.preventDefault();});
stage.addEventListener('drop',e=>{e.preventDefault();const fs=[...e.dataTransfer.files];fs.filter(f=>f.type.startsWith('image/')).forEach(addImageFile);const ff=fs.filter(f=>/\.(ttf|otf|woff2?)$/i.test(f.name));if(ff.length)addFontFiles(ff);});
stage.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();autoFit=false;setZoom(zoom*(e.deltaY<0?1.1:1/1.1));},{passive:false});
window.addEventListener('resize',()=>{if(autoFit)fit();else setZoom(zoom);});
window.addEventListener('contextmenu',e=>{if(e.target===ov)e.preventDefault();});

/* ---------- 시작 ---------- */
function demo(){
  S.bg={transparent:false,color:'#17121f'};
  const g=Object.assign(newShape('rect'),{w:832,h:1216,x:416,y:608,name:'배경 그라데이션'});g.fill={type:'grad',c1:'#2a0f4a',c2:'#0c0c12',angle:90,color:'#000'};g.autoName=false;S.layers.push(g);
  const t=newText('COVER LAB');presetCore(t,'아이돌 로고');t.size=112;t.y=520;t.rot=-6;S.layers.push(t);
  const b=newText('표지·에셋을 [#ffe600]여기서[/] 만들어요!');presetCore(b,'띠지 태그');b.size=44;b.y=700;b.rot=-6;S.layers.push(b);
}
async function boot(){
  cv.width=S.w;cv.height=S.h;fit();
  try{for(const f of await idb.all('fonts'))await registerFont(f.family,f.data,false);}catch(e){}
  let restored=false;
  try{const s=await idb.get('kv','autosave');if(s&&s.json){for(const a of s.assets||[])addAssetRaw(a.id,a.name,await blobToCanvas(a.orig),await blobToCanvas(a.mask));const o=JSON.parse(s.json);if(o.layers&&o.layers.length){applyState(o);restored=true;toast('이전 작업을 이어서 불러왔어요');}}}catch(e){}
  if(!restored){demo();applyState(JSON.parse(stateJSON()));}
  hist.stack=[];hist.i=-1;commit();refreshAll();
}
boot();
